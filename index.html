<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>物联网知识图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* 布局：左边可拖拽缩放的图，右边说明栏；手机上上下叠放。颜色＝领域，形状＝分级，填充＝了解程度 */
:root{
  --bg:#eef2f1; --panel:#ffffff; --fg:#1b2828; --muted:#5d6e6c; --line:#c3cfcc; --star:#d19a00;
  --iot:#2c7a57; --wireless:#2865a8; --embedded:#b8621a; --netsec:#9c3866;
  --uav:#5b4fb0; --ai:#16858a; --dev:#7a6838; --mech:#52677d; --cs:#c0442f;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-disp:"Noto Serif SC","Songti SC",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a19; --panel:#172322; --fg:#e2ebe9; --muted:#93a4a2; --line:#2c3b39; --star:#f2c443;
  --iot:#5cc497; --wireless:#6ea7e4; --embedded:#e69a57; --netsec:#e07aa6;
  --uav:#a49be8; --ai:#58cdd2; --dev:#c9b37c; --mech:#a3b6ca; --cs:#f08a74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a19; --panel:#172322; --fg:#e2ebe9; --muted:#93a4a2; --line:#2c3b39; --star:#f2c443;
  --iot:#5cc497; --wireless:#6ea7e4; --embedded:#e69a57; --netsec:#e07aa6;
  --uav:#a49be8; --ai:#58cdd2; --dev:#c9b37c; --mech:#a3b6ca; --cs:#f08a74; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.stage{position:relative;min-width:0;overflow:hidden}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.legend{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:16px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);pointer-events:none}
.legend div{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--c);box-sizing:border-box}
.legend i.k0{background:var(--panel)}
.legend i.k1{background:color-mix(in srgb,var(--c) 30%,var(--panel))}
.legend i.ring{background:none;border:2.5px solid var(--star);width:14px;height:14px}
.legend i.sq{border-radius:2px;background:none}
.legend i.big{width:16px;height:16px;background:none}
.legend i.ci{background:none}
.hint{position:absolute;bottom:12px;left:max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--muted);pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:20px;
  padding-block:20px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-size:22px;margin:0;text-wrap:balance;letter-spacing:.02em}
.intro{margin:6px 0 0;color:var(--muted);font-size:13px}
.intro b{color:var(--fg);font-weight:600}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.penbar{position:sticky;top:-20px;z-index:2;background:var(--panel);margin-top:-20px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.penbar .seg button[data-m="k1"][aria-pressed="true"]{background:color-mix(in srgb,var(--fg) 55%,var(--panel))}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;padding:7px 4px;border:none;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel);font-weight:600}
.card .seg{margin-top:10px}
.card .seg button[aria-pressed="true"]{background:var(--c);color:var(--panel)}
.card h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 8px;line-height:18px}
.spec{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 6px}
.card p.d{margin:0}
.rel{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.rel li{color:var(--muted)}
.rel b{color:var(--fg);font-weight:600}
.grp+.grp{margin-top:12px}
.grp h3{font-size:13px;font-weight:600;margin:0 0 6px}
details.dom{border-top:1px solid var(--line);padding-block:8px}
details.dom summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;list-style:none}
details.dom summary::-webkit-details-marker{display:none}
details.dom summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
details.dom[open] summary::before{transform:rotate(90deg)}
details.dom summary i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
details.dom summary small{margin-left:auto;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0}
.tools button,.linkbtn{font:inherit;font-size:12px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;background:none;color:var(--fg);border:1.5px solid var(--c);border-radius:999px;padding:1px 10px;cursor:pointer}
.chip.thing{border-radius:5px}
.chip.k1{background:color-mix(in srgb,var(--c) 22%,transparent)}
.chip.k2{background:var(--c);color:var(--panel)}
.chip.mid{font-weight:700}
.chip:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.empty{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.btn.pri{background:var(--fg);color:var(--panel);border-color:var(--fg)}
button.btn[aria-pressed="true"]{border-color:var(--star);background:color-mix(in srgb,var(--star) 18%,var(--panel))}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:2px solid var(--wireless);outline-offset:2px}
.status{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:1.6em}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
#find{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#q:focus-visible{outline:2px solid var(--wireless);outline-offset:1px}
#hits{margin-top:8px}
.foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.foot div{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.foot button{font:inherit;font-size:12px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.foot button.armed{color:var(--cs);font-weight:600}
/* 图里的元素 */
.l{stroke:var(--line);stroke-width:1.5}
.l.cross{stroke:var(--muted);stroke-dasharray:4 4;opacity:.55;stroke-width:1}
.n{cursor:pointer}
.n .dot{fill:var(--panel);stroke:var(--c);stroke-width:2.5}
.n.k1 .dot{fill:color-mix(in srgb,var(--c) 30%,var(--panel))}
.n.k2 .dot{fill:var(--c)}
.n.domain .dot{stroke-width:4}
.n.focus .dot{stroke:var(--fg);stroke-width:3}
.n .halo{fill:none;stroke:var(--star);stroke-width:3.5;opacity:0}
.n.star .halo{opacity:1}
.n text{fill:var(--fg);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.n.asked text{font-weight:700;font-size:14px}
.n.domain text{font-weight:700;font-size:14px;letter-spacing:.04em}
.n.cold{opacity:.3}
.l.cold{opacity:.15}
.n.busy .halo{opacity:1;stroke:var(--fg);stroke-width:2;stroke-dasharray:3 3;animation:spin 1.2s linear infinite}
@keyframes spin{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.n.busy .halo{animation:none}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  aside{border-left:none;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <svg id="g" aria-label="知识图谱"></svg>
    <div class="legend" id="legend"></div>
    <div class="hint">拖动节点或空白处 · 滚轮/双指缩放</div>
  </div>
  <aside>
    <section class="penbar">
      <p class="lbl">笔：选好后点图上的节点或目录里的词，点一下就标上；同一支笔再点一次＝取消</p>
      <div class="seg" id="mode">
        <button data-m="view">只看说明</button><button data-m="k1">◐ 听说过</button><button data-m="k2">● 熟悉</button><button data-m="star">★ 关注</button><button data-m="clear">清除</button>
      </div>
    </section>
    <div>
      <h1>物联网知识图谱</h1>
      <p class="intro"><b>LoRa</b> 和 <b>NFC</b> 属于无线通信，<b>ESP32</b> 属于嵌入式（单片机），<b>抓包</b> 属于网络分析与安全。从这四个词出发，把你听说过的、熟悉的、想深入的概念都标出来。</p>
    </div>
    <section>
      <p class="lbl">找一个词（图里没有的，可以让 Claude 放到合适位置）</p>
      <form id="find"><input id="q" type="search" placeholder="比如：Zigbee、卡尔曼滤波、有限元" autocomplete="off"><button class="btn">找</button></form>
      <div class="chips" id="hits"></div>
    </section>
    <section class="card" id="card"></section>
    <section>
      <p class="lbl">我的标记（拓展不会清掉）</p>
      <div id="marks"></div>
      <div class="row">
        <button class="btn pri" id="go">拓展特别关注</button>
        <button class="btn" id="stop" hidden>停止</button>

      <p class="note">每次拓展后，没标记、也没点过的节点先变灰；再拓展一次还没碰，就收起来。收起的不会删，随时能放回来。</p>
      <p class="status" id="status"></p>
    </section>
    <section>
      <p class="lbl">词条目录：用上面的笔一个个点过去；选「只看说明」时点词条只看说明</p>
      <div id="cat"></div>
    </section>
    <div class="foot">
      <div><span id="count"></span><button id="unfold" hidden></button></div>
      <div><span id="sync">标记存在本浏览器</span><button id="export">导出 JSON</button><button id="import">导入 JSON</button><input type="file" id="file" accept=".json,application/json" hidden><button id="reset">恢复初始图谱</button></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DOM = {iot:'物联网',wireless:'无线通信',embedded:'嵌入式',netsec:'网络与安全',uav:'无人机与飞控',ai:'AI 与大模型',dev:'软件开发与部署',mech:'机械工程',cs:'计算机基础'};
const KIND = {d:'领域',c:'概念 / 技术',t:'具体东西'};
// [id, 名字, 父节点, 分级 d领域/c概念/t具体东西, 一句话说明, 规格/数字, 是不是你问的]
const SEED = [
 ['iot','物联网 IoT',null,'d','把各种设备接上网，让它们自己采集数据、互相配合。智能门锁、共享单车、农田传感器都是物联网。','设备 → 网络 → 云 → 手机'],
 ['wireless','无线通信','iot','d','不用线、靠电磁波传数据。不同技术在「传多远、传多快、多省电」之间取舍。','频率越低传越远，越高传越快'],
 ['embedded','嵌入式 / 单片机','iot','d','藏在设备里的小电脑，只干一件事：控制门锁、读传感器、开关灯。','几块钱到几十块一颗'],
 ['netsec','网络分析与安全','iot','d','看清网络里传的是什么，排查故障、找漏洞、防攻击。','OSI 七层 / TCP/IP 四层'],
 ['uav','无人机与飞控',null,'d','让飞行器自己保持稳定、按航线飞的那套软硬件。飞控本身就是一块嵌入式板子。','姿态 · 导航 · 控制'],
 ['ai','AI 与大模型',null,'d','让电脑看懂文字、图片、声音并生成内容的技术。','训练 → 推理'],
 ['dev','软件开发与部署',null,'d','把想法写成程序，再放到服务器或手机上让人用起来。','写代码 → 版本管理 → 上线'],
 ['mech','机械工程',null,'d','设计、分析和制造机器的学问：力学、材料、加工、传动。','设计 → 仿真 → 加工'],
 ['cs','计算机基础',null,'d','计算机内部怎么工作：硬件组成、操作系统、算法、编程语言。','硬件 → 系统 → 程序'],
 ['lora','LoRa','wireless','c','远距离、超省电的无线技术。一节电池能用几年，信号能传几公里到十几公里，代价是每次只能传很少的数据。','433 / 470 / 868 / 915 MHz · 2–15 km · 0.3–50 kbps',1],
 ['nfc','NFC 近场通信','wireless','c','只有贴得很近（几厘米内）才能通信。手机刷公交、刷门禁、碰一碰配对耳机都是它。','13.56 MHz · <10 cm · 106–424 kbps',1],
 ['capture','抓包','netsec','c','把网络上来回传的数据包截下来逐个查看，用来排查网络问题、看 App 偷偷发了什么、做安全测试。','Wireshark · tcpdump · mitmproxy',1],
 ['esp32','ESP32','embedded','t','乐鑫出的便宜单片机，自带 WiFi 和蓝牙，开发板二三十块钱，做物联网小玩意最常用的芯片之一。','双核 240 MHz · 520 KB 内存 · WiFi + BLE',1],
 // 领域下的预置子节点
 ['wifi','WiFi','wireless','c','家里路由器那种无线网，速度快但费电，传几十米。','2.4 / 5 / 6 GHz'],
 ['ble','蓝牙低功耗 BLE','wireless','c','手环、耳机常用的省电版蓝牙，传十几米。','2.4 GHz · 1–2 Mbps'],
 ['rfid','RFID 射频识别','wireless','c','用无线电读取标签里的编号，超市防盗签、物流标签、门禁卡都属于它。NFC 是它的一个分支。','LF 125 kHz · HF 13.56 MHz · UHF 900 MHz'],
 ['sdr','软件无线电 SDR','wireless','c','用一个便宜的接收器加电脑软件，接收各种频段的无线信号，包括 LoRa。','RTL-SDR 约 200 元'],
 ['mcu','单片机 MCU','embedded','c','把处理器、内存、接口做在一颗芯片上的小电脑，ESP32、STM32 都是单片机。','几 MHz 到几百 MHz'],
 ['rtos','实时操作系统 RTOS','embedded','c','给单片机用的小型操作系统，让一颗芯片能同时跑多个任务，而且准时。','任务 · 队列 · 信号量'],
 ['stm32','STM32','mcu','t','意法半导体的单片机家族，工业和飞控里最常见，比 ESP32 更偏工业级，但不带 WiFi。','ARM Cortex-M'],
 ['freertos','FreeRTOS','rtos','t','最常用的免费 RTOS，ESP32 默认就用它。','开源 · MIT 协议'],
 ['mqtt','MQTT','iot','c','物联网设备最常用的「发消息」规则：设备往一个话题里发数据，订阅这个话题的都能收到。','端口 1883 / 8883'],
 ['ha','Home Assistant','iot','t','开源的智能家居中控，把不同品牌的设备放到一个界面里管理和联动。','常跑在树莓派上'],
 ['pentest','渗透测试','netsec','c','受委托、合法地模拟黑客攻击，提前找出系统漏洞。','先授权，再测试'],
 ['flipper','Flipper Zero','netsec','t','巴掌大的多功能无线电工具，能读 NFC、RFID、红外、Sub-GHz 信号，安全研究者常用。','Sub-GHz · NFC · 125 kHz · 红外'],
 // 四个词下的预置子节点
 ['lorawan','LoRaWAN','lora','c','LoRa 之上的组网规则：规定设备怎样经过网关、把数据送到服务器。LoRa 管「怎么发信号」，LoRaWAN 管「怎么组网」。','Class A / B / C'],
 ['lgw','LoRa 网关','lora','c','一类设备：同时收几千个 LoRa 设备的信号，再通过网线或 4G 转发到服务器。','8 通道 · SX1302'],
 ['css','线性调频扩频 CSS','lora','c','LoRa 能传这么远的原因：把信号「拉长」成一段扫频，即使淹没在噪声里也能解出来。','扩频因子 SF7–SF12'],
 ['sx126x','SX1262 芯片','lora','t','Semtech 新一代 LoRa 收发芯片，功耗更低','+22 dBm 发射功率'],
 ['meshtastic','Meshtastic','lora','t','开源项目：用 LoRa 板子组一张不靠手机信号的消息网，户外徒步、应急通信常用。','多跳中继 · 手机蓝牙连'],
 ['mifare','MIFARE 卡','nfc','t','最常见的门禁卡、饭卡、老式公交卡芯片。老款 Classic 加密早已被破解。','1K / 4K 存储'],
 ['ndef','NDEF 数据格式','nfc','c','NFC 标签里存数据的标准格式，比如存一个网址，手机一碰就打开。','URI / 文本 / 名片记录'],
 ['hce','HCE 手机模拟卡','nfc','c','手机假装成一张卡，Apple Pay、手机门禁、手机公交卡靠的就是它。','安全芯片 SE / 主机模拟'],
 ['pn532','PN532 读卡模块','nfc','t','十几块钱的 NFC 读写模块，接到单片机上就能读写卡片。','I2C / SPI / UART'],
 ['wireshark','Wireshark','capture','t','最有名的免费抓包软件，能把每个数据包按协议一层层拆开给你看。','过滤语法：http && ip.addr==…'],
 ['tcpip','TCP/IP 协议栈','capture','c','网络通信的分层规则：IP 管地址，TCP 管可靠送达，HTTP 等管具体内容。看懂抓包先要懂它。','三次握手 SYN → SYN-ACK → ACK'],
 ['https','HTTPS','capture','c','网页通信加了 TLS 加密，抓包只见乱码','端口 443'],
 ['mitm','中间人代理','capture','c','在手机和服务器中间放一个代理，装上它的证书，就能解开 HTTPS 看清 App 发的内容。','Charles · Fiddler · mitmproxy'],
 ['monitor','WiFi 监听模式','capture','c','让无线网卡收下空中所有 WiFi 包，不只是发给自己的。','monitor mode · 802.11'],

/* ---------- 数据 ---------- */
// DEF：网页自带的全部词条（预置 + 你项目里的 + 通用词条）；Claude 新加的另存在状态里
const DEF=new Map();
for(const [id,label,parent,kind,desc,spec,asked] of SEED) DEF.set(id,{id,label,parent,kind,desc,spec,asked:!!asked});
for(const [id,label,parent,kind,desc,src] of [...CANDS,...POOL,...SPLIT]) if(!DEF.has(id)) DEF.set(id,{id,label,parent,kind,desc,src:src||''});
let nodes=new Map(), links=[], focus='lora', seq=0, mode='view';
const busy=new Set();

function lvl(n){let k=0;while(n.parent&&k<20){n=nodes.get(n.parent);k++}return k}
function grp(n){let k=0;while(n.kind!=='d'&&n.parent&&k++<20) n=nodes.get(n.parent); return DOM[n.id]?n.id:'iot'}
// 状态：n＝每个节点的 {s 显示, k 了解程度, st 关注, e 拓展过, c 冷度, f 收起}；ai＝Claude 加的节点；x＝Claude 加的联系
function build(st){
  nodes=new Map(); links=[];
  for(const d of [...DEF.values(),...((st&&st.ai)||[])]) if(!nodes.has(d.id)) nodes.set(d.id,{...d,know:d.asked?1:0,star:false,shown:START.has(d.id)||!!d.asked});
  for(const n of nodes.values()) if(n.parent&&!nodes.has(n.parent)) n.parent=null;
  for(const n of nodes.values()) if(n.parent) links.push({s:n.parent,t:n.id});
  for(const [s,t,note] of CROSS) links.push({s,t,note,cross:1});
  for(const l of (st&&st.x)||[]) if(nodes.has(l.s)&&nodes.has(l.t)) links.push({s:l.s,t:l.t,note:l.note,cross:1,ai:1});
  if(st&&st.n) for(const n of nodes.values()){const v=st.n[n.id]||{}; n.shown=!!v.s; n.know=v.k|0; n.star=!!v.st; n.expanded=!!v.e; n.cold=v.c|0; n.folded=!!v.f;}
  for(const n of nodes.values()){n.level=lvl(n); n.group=grp(n)}
  for(const n of nodes.values()) if(n.shown){let p=n.parent&&nodes.get(n.parent);while(p&&!p.shown){p.shown=true;p.folded=false;p=p.parent&&nodes.get(p.parent)}}  // 上图的节点，上级也得在图上
  if(st){focus=nodes.has(st.focus)?st.focus:'lora'; seq=st.seq|0; mode=st.mode||'view'}
}
function snapshot(){
  const n={};
  for(const x of nodes.values()){const v={s:x.shown?1:0,k:x.know|0,st:x.star?1:0,e:x.expanded?1:0,c:x.cold|0,f:x.folded?1:0};
    const w=Object.fromEntries(Object.entries(v).filter(e=>e[1])); if(Object.keys(w).length) n[x.id]=w;}
  return {v:2,n,
    ai:[...nodes.values()].filter(x=>x.ai).map(({id,label,parent,kind,desc,spec,src})=>({id,label,parent,kind,desc,spec,src,ai:1})),
    x:links.filter(l=>l.ai).map(({s,t,note})=>({s,t,note})), focus, seq, mode};
}
// 旧版（只有「听说过」一档）的存档：听说过 → 听说过·不太懂
function fromV1(o){
  const st={n:{},ai:[],x:[],focus:o.f,seq:o.q,mode:o.m==='heard'?'k1':(o.m||'view')};
  for(const n of o.n||[]){
    if(!DEF.has(n.id)) st.ai.push({id:n.id,label:n.label,parent:n.parent,kind:n.kind||'c',desc:n.desc,spec:n.spec,src:n.src,ai:1});
    st.n[n.id]={s:n.shown?1:0,k:n.heard?1:0,st:n.star?1:0,e:n.expanded?1:0,c:n.cold|0,f:n.folded?1:0};
  }
  for(const l of o.l||[]) if(l.cross&&!CROSS.some(c=>c[0]===l.s&&c[1]===l.t)) st.x.push({s:l.s,t:l.t,note:l.note});
  return st;
}
// 合并另一份存档：了解程度取高的，关注、显示取并集，不会让你丢标记
function mergeIn(o){
  const st=o&&o.v===2?o:fromV1(o), cur=snapshot();
  for(const a of st.ai||[]) if(!DEF.has(a.id)&&!cur.ai.some(b=>b.id===a.id)) cur.ai.push(a);
  for(const x of st.x||[]) if(!cur.x.some(y=>y.s===x.s&&y.t===x.t)) cur.x.push(x);
  for(const [id,v] of Object.entries(st.n||{})){const c=cur.n[id]||{};
    cur.n[id]={s:(c.s||v.s)?1:0,k:Math.max(c.k|0,v.k|0),st:(c.st||v.st)?1:0,e:(c.e||v.e)?1:0,c:Math.min(c.c|0,v.c|0),f:(c.f&&v.f)?1:0};}
  cur.seq=Math.max(cur.seq|0,st.seq|0); build(cur);
}

/* ---------- 保存与同步：本浏览器 + Artifact 云端（有就用） ---------- */
const LS='kg-iot-v2';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
{const v2=lsGet(LS), v1=lsGet('kg-iot-v1'); build(v2||(v1?fromV1(v1):null));}
let dbRef=null, lastJSON='', myT=0, saveT=0, writing=false, again=false;
const setSync=t=>{document.getElementById('sync').textContent=t};
function save(){ lsSet(LS,snapshot()); if(dbRef){clearTimeout(saveT); saveT=setTimeout(flush,1200)} }
async function flush(){
  if(writing){again=true;return} writing=true;
  try{const s=snapshot(), j=JSON.stringify(s); if(j!==lastJSON){myT=Date.now(); await dbRef.set({...s,t:myT}); lastJSON=j; setSync('已同步到云端')}}
  catch(e){setSync(e.code==='quota_exceeded'?'云端空间满了，请先导出 JSON':'云端同步失败，标记暂存在本浏览器')}
  finally{writing=false; if(again){again=false;flush()}}
}
function applyRemote(st,msg){build(st); lastJSON=JSON.stringify(snapshot()); myT=st.t; redraw(); setSync(msg)}
window.claude?.use?.('db').then(async d=>{
  if(!d) return; const ref=d.doc('graph/state');
  try{
    const snap=await ref.get(); dbRef=ref;
    if(snap.exists){ const st=snap.data(); const local=lsGet(LS);
      build(st); if(local) mergeIn(local);   // 本机还有没上传的标记，合并进去
      lastJSON=JSON.stringify(st.v?{v:st.v,n:st.n,ai:st.ai,x:st.x,focus:st.focus,seq:st.seq,mode:st.mode}:{}); myT=st.t; redraw(); setSync('已从云端载入'); save(); }
    else { await flush(); }
    ref.onSnapshot(sn=>{ if(!sn.exists||sn.metadata.hasPendingWrites) return; const st=sn.data(); if(st.t===myT) return; applyRemote(st,'其他设备有更新，已同步'); },()=>{});
  }catch(e){ dbRef=null; setSync('云端暂时连不上，标记暂存在本浏览器'); }
}).catch(()=>{});
// 单独放到网站上时：本浏览器没有存档，就读同目录的 graph.json
if(!window.claude&&!lsGet(LS)&&!lsGet('kg-iot-v1')) fetch('graph.json').then(r=>r.ok?r.json():null).then(st=>{if(st){build(st.v===2?st:fromV1(st));redraw();setSync('已从 graph.json 载入')}}).catch(()=>{});

/* ---------- 图 ---------- */
const svg=d3.select('#g'), root=svg.append('g'), linkG=root.append('g'), nodeG=root.append('g');
svg.call(d3.zoom().scaleExtent([.15,3]).on('zoom',e=>root.attr('transform',e.transform))).on('dblclick.zoom',null);
const R=n=>n.kind==='d'?(n.id==='iot'?26:20):n.kind==='t'?(n.asked?15:8):(n.asked?17:10);
const sim=d3.forceSimulation()
  .force('link',d3.forceLink().id(d=>d.id).distance(l=>l.cross?150:l.target.kind==='d'||l.target.asked?100:62).strength(l=>l.cross?.04:.7))
  .force('charge',d3.forceManyBody().strength(-300))
  .force('collide',d3.forceCollide(d=>R(d)+16))
  .force('x',d3.forceX().strength(.04)).force('y',d3.forceY().strength(.04))
  .on('tick',()=>{
    linkG.selectAll('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeG.selectAll('g.n').attr('transform',d=>`translate(${d.x},${d.y})`);
  });
const fit=()=>{const r=document.getElementById('stage').getBoundingClientRect();svg.attr('viewBox',[-r.width/2,-r.height/2,r.width,r.height])};
new ResizeObserver(fit).observe(document.getElementById('stage')); fit();
function redraw(){nodeG.selectAll('*').remove();linkG.selectAll('*').remove();render()}

function render(){
  const vis=[...nodes.values()].filter(n=>n.shown), ids=new Set(vis.map(n=>n.id));
  const ls=links.filter(l=>ids.has(l.s)&&ids.has(l.t)).map(l=>({source:l.s,target:l.t,cross:l.cross,k:l.s+'>'+l.t,a:l.s,b:l.t}));
  const cold=id=>nodes.get(id).cold===1;
  linkG.selectAll('line').data(ls,d=>d.k).join('line').attr('class',d=>(d.cross?'l cross':'l')+(cold(d.a)||cold(d.b)?' cold':''));
  const g=nodeG.selectAll('g.n').data(vis,d=>d.id).join(enter=>{
    const g=enter.append('g').attr('tabindex',0).attr('role','button')
      .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
        .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=d.fy=null}))
      .on('click',(e,d)=>hit(d)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(d)}});
    // 具体东西画方块，概念和领域画圆
    g.each(function(d){const s=d3.select(this),r=R(d),sq=d.kind==='t';
      s.append(sq?'rect':'circle').attr('class','halo').call(sq?x=>x.attr('x',-r-6).attr('y',-r-6).attr('width',2*r+12).attr('height',2*r+12).attr('rx',5):x=>x.attr('r',r+6));
      s.append(sq?'rect':'circle').attr('class','dot').call(sq?x=>x.attr('x',-r).attr('y',-r).attr('width',2*r).attr('height',2*r).attr('rx',3):x=>x.attr('r',r));
      s.append('text').attr('text-anchor','middle').attr('y',r+15)});
    return g;
  });
  g.attr('class',d=>`n k${d.know|0}${d.kind==='d'?' domain':''}${d.star?' star':''}${d.asked?' asked':''}${d.id===focus?' focus':''}${busy.has(d.id)?' busy':''}${d.cold===1?' cold':''}`)
   .attr('style',d=>`--c:var(--${d.group})`).attr('aria-label',d=>d.label+'，'+KNOW[d.know|0]);
  g.select('text').text(d=>(d.star?'★ ':'')+d.label);
  sim.nodes(vis); sim.force('link').links(ls); sim.alpha(.3).restart();
  panel(); save();
}
// 笔：听说过 / 熟悉 / 关注点一下就标上，同一支笔再点一次取消；清除把这个词的标记都去掉
function hit(d){
  if(mode==='k1'||mode==='k2'){const v=mode==='k1'?1:2; d.know=(d.know===v)?0:v}
  else if(mode==='star') d.star=!d.star;
  else if(mode==='clear'){d.know=0;d.star=false}
  if(d.know||d.star) showUp(d.id);
  d.cold=0; focus=d.id; render();
}
function showUp(id){let n=nodes.get(id),k=0;while(n&&k++<20){n.shown=true;n.folded=false;n.cold=0;n=n.parent&&nodes.get(n.parent)}}
// 收缩：有标记的、你问的、领域、本次刚拓展出来的（连同上级）保留；其余每次拓展冷一级，1 变灰，2 收起
function fold(fresh){
  const keep=new Set();
  for(const n of nodes.values()) if(n.shown&&(n.know||n.star||n.asked||n.kind==='d'||fresh.has(n.id))){let p=n;while(p&&!keep.has(p.id)){keep.add(p.id);p=p.parent&&nodes.get(p.parent)}}
  let gray=0,gone=0;
  for(const n of nodes.values()){ if(!n.shown) continue;
    if(keep.has(n.id)){n.cold=0;continue}
    n.cold=(n.cold||0)+1; if(n.cold>=2){n.shown=false;n.folded=true;gone++} else gray++; }
  for(const n of nodes.values()) if(n.shown){let p=n.parent&&nodes.get(n.parent);while(p){if(!p.shown){n.shown=false;n.folded=true;gone++;break}p=p.parent&&nodes.get(p.parent)}}
  return (gray||gone)?`；${gray?`${gray} 个没碰过的变灰`:''}${gray&&gone?'，':''}${gone?`${gone} 个收起了`:''}`:'';
}
function addNode(o){
  const p=o.parent&&nodes.get(o.parent), id='ai'+(++seq);
  const n={id,shown:true,know:0,star:false,...o,x:p?.x,y:p?.y};
  nodes.set(id,n); if(p) links.push({s:p.id,t:id}); n.level=lvl(n); n.group=grp(n); if(n.shown) showUp(id); return n;
}

/* ---------- 右栏 ---------- */
const $=id=>document.getElementById(id);
function el(tag,attrs,text){const e=document.createElement(tag);Object.assign(e,attrs||{});if(text!=null)e.textContent=text;return e}
function tag(text,color){const t=el('span',{className:'tag'},text);t.style.setProperty('--c',color);return t}
function chip(k,onclick,title,extra){const b=el('button',{className:`chip k${k.know|0}`+(k.kind==='t'?' thing':'')+(extra?' '+extra:''),title:title||''},k.label); b.style.setProperty('--c',`var(--${k.group})`); b.onclick=onclick; return b}
const SYM=['○ ','◐ ','● '];
const openDom=new Set();
function panel(){
  for(const b of $('mode').children) b.setAttribute('aria-pressed',b.dataset.m===mode);
  const n=nodes.get(focus), c=$('card'); c.replaceChildren();
  if(n){
    c.style.setProperty('--c',`var(--${n.group})`);
    c.append(el('p',{className:'lbl'},'节点说明'));
    const h=el('h2',null,n.label);
    h.append(tag(KIND[n.kind],'var(--fg)'));
    if(n.kind!=='d') h.append(tag(DOM[n.group],`var(--${n.group})`));
    if(n.ai) h.append(tag('Claude 加的','var(--muted)'));
    c.append(h); if(n.spec) c.append(el('p',{className:'spec'},n.spec)); c.append(el('p',{className:'d'},n.desc||''));
    const path=[];let p=n;while(p.parent){p=nodes.get(p.parent);path.unshift(p.label)}
    const ul=el('ul',{className:'rel'});
    if(path.length) ul.append(el('li',null,'所在位置：'+path.join(' › ')));
    if(n.src) ul.append(el('li',null,'你在这里碰到过：'+n.src));
    for(const l of links) if(l.cross&&(l.s===n.id||l.t===n.id)){const o=nodes.get(l.s===n.id?l.t:l.s); if(!o?.shown) continue; const li=el('li');li.append(el('b',null,o.label+'：'),l.note||'相关');ul.append(li)}
    if(ul.children.length) c.append(ul);
    const seg=el('div',{className:'seg'});
    KNOW.forEach((t,i)=>{const b=el('button',null,t); b.setAttribute('aria-pressed',(n.know|0)===i); b.onclick=()=>{n.know=i;n.cold=0;render()}; seg.append(b)});
    c.append(seg);
    const row=el('div',{className:'row'});
    const sb=el('button',{className:'btn'},n.star?'★ 特别关注中':'☆ 特别关注'); sb.setAttribute('aria-pressed',!!n.star); sb.onclick=()=>{n.star=!n.star;render()};
    const x=el('button',{className:'btn'},n.expanded?'再拓展一些':'拓展这个'); x.disabled=busy.size>0; x.onclick=()=>expand([n.id]);
    row.append(sb,x); c.append(row);
  }
  const all=[...nodes.values()], stars=all.filter(n=>n.star), k1=all.filter(n=>n.know===1&&n.kind!=='d'), k2=all.filter(n=>n.know===2&&n.kind!=='d');
  const m=$('marks'); m.replaceChildren();
  for(const [title,list,emptyText] of [['★ 特别关注',stars,'还没有。选上面「★ 关注」，再点节点。'],['◐ 听说过·不太懂',k1,'还没有。'],['● 熟悉',k2,'还没有。']]){
    const gp=el('div',{className:'grp'}); gp.append(el('h3',null,`${title}（${list.length}）`));
    const ch=el('div',{className:'chips'});
    if(!list.length) ch.append(el('span',{className:'empty'},emptyText));
    for(const k of list.slice(0,60)) ch.append(chip(k,()=>{showUp(k.id);focus=k.id;render()},'查看说明'));
    if(list.length>60) ch.append(el('span',{className:'empty'},`还有 ${list.length-60} 个，在下面的词条目录里看`));
    gp.append(ch); m.append(gp);
  }
  const todo=stars.filter(n=>!n.expanded);
  $('go').disabled=!todo.length||busy.size>0;
  $('go').textContent=todo.length?`拓展特别关注（${todo.length} 个还没拓展）`:'特别关注都拓展过了';
  catalog();
  const shown=all.filter(n=>n.shown).length, folded=all.filter(n=>n.folded&&!n.shown).length;
  $('count').textContent=`图上 ${shown} 个 · 熟悉 ${k2.length} · 听说过 ${k1.length} · 关注 ${stars.length}`;
  $('unfold').hidden=!folded; $('unfold').textContent=`放回收起的 ${folded} 个`;
}
// 词条目录：每个领域一组，按上下级顺序排；有子节点的中间层加粗
function catalog(){
  const cd=$('cat'), kids=new Map();
  for(const n of nodes.values()) if(n.parent){if(!kids.has(n.parent))kids.set(n.parent,[]);kids.get(n.parent).push(n)}
  cd.replaceChildren();
  for(const d of ORDER){
    const list=[], walk=id=>{for(const k of kids.get(id)||[]){ if(k.kind!=='d'){list.push(k);walk(k.id)} }}; walk(d);
    const det=el('details',{className:'dom'}); det.open=openDom.has(d); det.style.setProperty('--c',`var(--${d})`);
    det.ontoggle=()=>{if(det.open===openDom.has(d)) return; det.open?openDom.add(d):openDom.delete(d); catalog()};
    const sum=el('summary'); sum.append(el('i'),DOM[d],el('small',null,`熟悉 ${list.filter(n=>n.know===2).length} · 听说过 ${list.filter(n=>n.know===1).length} · 共 ${list.length}`));
    det.append(sum);
    const tools=el('div',{className:'tools'});
    const b1=el('button',null,'没标的全标听说过'); b1.onclick=()=>{list.forEach(n=>{if(!n.know)n.know=1;showUp(n.id)});render()};
    const b2=el('button',null,'全标熟悉'); b2.onclick=()=>{list.forEach(n=>{n.know=2;showUp(n.id)});render()};
    const b3=el('button',null,'让 Claude 再给 20 个'); b3.onclick=()=>more(d); b3.disabled=busy.size>0;
    tools.append(b1,b2); if(window.claude) tools.append(b3); det.append(tools);
    const ch=el('div',{className:'chips'});
    if(det.open) for(const k of list){const b=chip(k,()=>hit(k), (k.desc||'')+(k.src?`（${k.src}）`:''), kids.has(k.id)?'mid':'');
      b.textContent=SYM[k.know|0]+(k.star?'★ ':'')+k.label; ch.append(b)}
    det.append(ch); cd.append(det);
  }
}
$('mode').onclick=e=>{const m=e.target.dataset?.m; if(m){mode=m;render()}};
$('unfold').onclick=()=>{for(const n of nodes.values()) if(n.folded){n.shown=true;n.folded=false;n.cold=0} $('status').textContent='收起的节点都放回来了。'; render()};

/* ---------- 搜索 ---------- */
function search(q,submit){
  const h=$('hits'); h.replaceChildren(); if(!q) return;
  const low=q.toLowerCase(), ns=[...nodes.values()].filter(n=>n.label.toLowerCase().includes(low)).slice(0,10);
  const go=n=>{showUp(n.id);focus=n.id;$('q').value='';h.replaceChildren();render()};
  if(submit&&ns.length) return go(ns[0]);
  for(const n of ns) h.append(chip(n,()=>go(n),n.shown?'在图上':'点一下放到图上'));
  if(ns.length) return;
  if(!submit){h.append(el('span',{className:'empty'},`图里没有「${q}」，按回车让 Claude 把它放到合适的位置。`));return}
  askAdd(q);
}
$('q').oninput=()=>search($('q').value.trim());
$('find').onsubmit=e=>{e.preventDefault();search($('q').value.trim(),true)};

/* ---------- 让 Claude 帮忙 ---------- */
let sample=null, ctl=null, dl=null;
window.claude?.use?.('sample').then(s=>{sample=s}).catch(()=>{});
window.claude?.use?.('downloads').then(d=>{dl=d}).catch(()=>{});
const ERR={not_granted:'没有允许本页使用 Claude，所以只能用网页里自带的词条。',sampling_disabled:'你的账号暂时不能在网页里调用 Claude。',
  rate_limited:'调用太频繁或额度用完了，过一会再试。',session_expired:'登录过期了，刷新页面重新登录。',
  invalid_json:'Claude 回的格式不对，再点一次试试。',refused:'Claude 拒绝了这次请求，换个说法试试。'};
const noClaude=()=>window.claude?'要允许本页使用 Claude 后才能用这个功能。':'这个功能要用到 Claude，只在 claude.ai 上的版本里能用；这里可以用自带的词条。';
function marksText(){const a=[...nodes.values()], nm=f=>a.filter(f).map(n=>n.label).join('、')||'无';
  return `这个人的背景：${PROFILE}
他熟悉的：${nm(n=>n.know===2&&n.kind!=='d')}
他听说过但不太懂的：${nm(n=>n.know===1&&n.kind!=='d')}
他特别关注的：${nm(n=>n.star)}`}
const kindOf=s=>String(s).includes('具体')?'t':'c';
const findLabel=s=>[...nodes.values()].find(n=>n.label===String(s));

async function expand(want){
  const local=[], remote=[], fresh=new Set(want);
  for(const id of want){
    showUp(id);
    const kids=[...nodes.values()].filter(n=>n.parent===id&&!n.shown);
    const preset=kids.some(k=>!k.folded);
    kids.forEach(k=>{showUp(k.id);fresh.add(k.id)});
    if(preset||kids.length&&!sample){nodes.get(id).expanded=true;local.push(id)} else remote.push(id);
  }
  if(!remote.length){ $('status').textContent=`展开了 ${local.length} 个节点的现成内容`+fold(fresh)+'。'; return render(); }
  if(!sample){ $('status').textContent=(local.length?'现成内容已展开；':'')+`「${remote.map(i=>nodes.get(i).label).join('、')}」没有现成内容，`+noClaude()+fold(fresh).replace('；',' '); return render(); }
  remote.forEach(id=>busy.add(id)); render();
  $('status').textContent='Claude 正在想…'; $('stop').hidden=false; ctl=new AbortController();
  try{
    const items=remote.map(id=>{const n=nodes.get(id);const path=[];let p=n;while(p.parent){p=nodes.get(p.parent);path.unshift(p.label)}
      return `- 「${n.label}」（${KIND[n.kind]}，位置：${[...path,n.label].join(' › ')}）：${n.desc||''}`}).join('\n');
    const list=await sample.json(`你在帮一个人往下扩展他的中文个人知识图谱。图谱分三级：领域 > 概念/技术（原理、协议、方法、标准）> 具体东西（具体芯片、产品、软件、工具）。
${marksText()}

要拓展的节点：
${items}

图里已有这些节点，不要重复：${[...nodes.values()].map(n=>n.label).join('、')}

为每个要拓展的节点给出 4 个最值得他接着了解的下一级内容；必须比父节点更小、更具体。他熟悉的方向少给基础词，多给进阶词；他不太懂的方向先给入门必备的词。
kind 写「概念」或「具体东西」；desc 大白话一句，不超过 45 个汉字；spec 写一个短的规格、数字或例子（没有就空字符串）；related 写 0-2 个已有节点名（原样照抄）。
只回复一个 JSON 数组，每项形如：
{"parent":"LoRa","label":"扩频因子 SF","kind":"概念","desc":"数字越大传得越远，但越慢越费电。","spec":"SF7–SF12","related":["LoRaWAN"]}`,{signal:ctl.signal,modelTier:'quick',cache:false});
    let added=0;
    for(const it of Array.isArray(list)?list:[]){
      const par=remote.find(id=>nodes.get(id).label===String(it.parent))||(remote.length===1?remote[0]:null);
      const label=String(it.label||'').trim().slice(0,30); if(!par||!label) continue;
      const dup=findLabel(label);
      if(dup){ if(!links.some(l=>(l.s===par&&l.t===dup.id)||(l.t===par&&l.s===dup.id))) links.push({s:par,t:dup.id,cross:1,ai:1,note:'Claude 认为两者相关'}); showUp(dup.id); fresh.add(dup.id); continue; }
      const n=addNode({label,parent:par,kind:kindOf(it.kind),desc:String(it.desc||'').slice(0,120),spec:String(it.spec||'').slice(0,60),ai:1});
      fresh.add(n.id); added++;
      for(const r of (Array.isArray(it.related)?it.related:[]).slice(0,2)){const o=findLabel(r); if(o&&o.id!==par) links.push({s:n.id,t:o.id,cross:1,ai:1,note:'Claude 认为两者相关'})}
    }
    remote.forEach(id=>nodes.get(id).expanded=true);
    $('status').textContent=`新增 ${added} 个节点${local.length?'，另展开了现成内容':''}`+fold(fresh)+'。你的标记都还在。';
  }catch(e){
    $('status').textContent=e.code==='cancelled'?'已停止。':(ERR[e.code]||'出错了，稍后再点一次。');
    if(e.code==='not_granted'||e.code==='sampling_disabled') sample=null;
  }finally{ busy.clear(); $('stop').hidden=true; render(); }
}
// 某个领域再要 20 个候选词：只进词条目录，不上图，等你标了才上图
async function more(d){
  if(!sample){$('status').textContent=noClaude();return}
  const inDom=[...nodes.values()].filter(n=>n.group===d);
  $('status').textContent=`Claude 正在给「${DOM[d]}」找更多词…`; busy.add(d); panel();
  try{
    const list=await sample.json(`你在帮一个人回忆他可能听说过的概念，用来补全他的中文个人知识图谱。图谱分三级：领域 > 概念/技术 > 具体东西。
${marksText()}

这次只看领域「${DOM[d]}」。这个领域里已有：${inDom.map(n=>n.label).join('、')}
整张图里已有（不要重复，同义也算重复）：${[...nodes.values()].map(n=>n.label).join('、')}

再给 20 个这个领域里他很可能听说过、但图里还没有的词，从常见到进阶都要有。每个词挂到这个领域里最贴切的已有节点下面（parent 原样照抄已有名字，可以是「${DOM[d]}」本身）。
kind 写「概念」或「具体东西」；desc 大白话一句，不超过 30 个汉字。
只回复一个 JSON 数组，每项形如：{"label":"……","parent":"……","kind":"概念","desc":"……"}`,{modelTier:'quick',cache:false});
    let added=0;
    for(const it of Array.isArray(list)?list:[]){
      const label=String(it.label||'').trim().slice(0,30); if(!label||findLabel(label)) continue;
      const par=inDom.find(n=>n.label===String(it.parent))||nodes.get(d);
      addNode({label,parent:par.id,kind:kindOf(it.kind),desc:String(it.desc||'').slice(0,120),ai:1,shown:false}); added++;
    }
    openDom.add(d);
    $('status').textContent=`「${DOM[d]}」新加了 ${added} 个候选词，在词条目录里，标了才会上图。`;
  }catch(e){ $('status').textContent=ERR[e.code]||'出错了，稍后再试。'; if(e.code==='not_granted'||e.code==='sampling_disabled') sample=null; }
  busy.delete(d); render();
}
async function askAdd(q){
  if(!sample){$('status').textContent=`图里没有「${q}」。`+noClaude();return}
  $('status').textContent=`Claude 正在给「${q}」找位置…`;
  const all=[...nodes.values()];
  try{
    const it=await sample.json(`下面是一张中文知识图谱里已有的节点，括号里是分级（领域 > 概念/技术 > 具体东西）：
${all.map(n=>`${n.label}（${KIND[n.kind]}）`).join('、')}

用户想把「${q}」加进去。判断它是「概念」（技术、原理、协议、方法、标准）还是「具体东西」（具体芯片、产品、软件、工具），从已有节点里挑一个最贴切、比它大一级的当父节点（原样照抄已有节点名）。
desc 大白话一句，不超过 45 个汉字；spec 写一个短的规格、数字或例子，没有就空字符串。用户输入有错别字或是简称时，label 写规范叫法。
只回复一个 JSON 对象，形如：{"label":"Zigbee","parent":"无线通信","kind":"概念","desc":"……","spec":"2.4 GHz · 自组网"}`,{modelTier:'quick',cache:false});
    const label=String(it?.label||q).trim().slice(0,30);
    const dup=findLabel(label);
    if(dup){showUp(dup.id);focus=dup.id;$('status').textContent=`「${label}」本来就在图里。`;return render()}
    const par=findLabel(it?.parent)||nodes.get('iot');
    const n=addNode({label,parent:par.id,kind:kindOf(it?.kind),desc:String(it?.desc||'').slice(0,120),spec:String(it?.spec||'').slice(0,60),ai:1,know:1});
    focus=n.id; $('q').value=''; $('hits').replaceChildren();
    $('status').textContent=`已把「${label}」放到「${par.label}」下面，先标成听说过。`;
  }catch(e){ $('status').textContent=ERR[e.code]||'出错了，稍后再试。'; if(e.code==='not_granted'||e.code==='sampling_disabled') sample=null; }
  render();
}
$('go').onclick=()=>expand([...nodes.values()].filter(n=>n.star&&!n.expanded).map(n=>n.id));
$('stop').onclick=()=>ctl?.abort();

/* ---------- 导出 / 导入 / 清空 ---------- */
$('export').onclick=async()=>{
  const data=JSON.stringify({...snapshot(),t:Date.now(),app:'kg-iot'});
  const name=`knowledge-graph-${new Date().toISOString().slice(0,10)}.json`;
  if(dl){ try{const r=await dl.save({filename:name,data}); setSync(r.status==='saved'?'已导出 '+name:'已交给系统保存')}catch(e){setSync('没有导出')} return; }
  if(window.claude){ setSync('这里暂时不能下载文件'); return; }
  const a=el('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:name}); document.body.append(a); a.click(); a.remove(); setSync('已导出 '+name);
};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const o=JSON.parse(await f.text()); if(!o||typeof o!=='object'||!(o.n)) throw 0; mergeIn(o); redraw(); setSync('已合并导入的标记（只加不减）'); }
  catch(_){ setSync('这个文件不是本图谱导出的 JSON'); }
};
let armT=0;
$('reset').onclick=()=>{
  const b=$('reset');
  if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='会清空所有标记，再点一次确认'; clearTimeout(armT);
    armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='恢复初始图谱'},4000); return; }
  clearTimeout(armT); b.classList.remove('armed'); b.textContent='恢复初始图谱';
  build(null); $('status').textContent='已恢复初始图谱。'; redraw();
};

const lg=$('legend'), row1=el('div'), row2=el('div');
row1.append(...ORDER.concat([]).map(k=>{const s=el('span');s.style.setProperty('--c',`var(--${k})`);s.append(el('i'),DOM[k]);return s}));
for(const [cls,txt] of [['big','领域'],['ci','概念'],['sq','具体东西'],['k0','没听过'],['k1','听说过'],['','熟悉'],['ring','关注']]){const s=el('span');s.style.setProperty('--c','var(--muted)');s.append(el('i',{className:cls}),txt);row2.append(s)}
lg.append(row1,row2);
render();
